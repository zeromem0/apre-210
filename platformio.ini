; APRE-210: AprecID and the RS232/TTL tester on the FNIRSI DST-210, an Artery
; AT32F403A treated as an STM32F103VE. The sources of apre-510 (DSO-510) with
; the DST-210 board of dst210-link.
;
; flash_apre builds the tester for the unit's flash, linked after the FNIRSI
; application V0.1.0 (which ends at 0x0806AE80), at 0x0806B000. It is never
; uploaded from here: the unit's flash is read-protected. tools/make_update.py
; puts it together with the FNIRSI application into a file for the FNIRSI USB
; update.
;
; The platform and the library are pinned to the versions the firmware was
; built and tested with.

[platformio]
default_envs = flash_apre
; test builds that run from RAM over SWD, and the build with the USB Sender;
; kept apart, not published
extra_configs = tools/*.ini

[env]
platform = ststm32@19.0.0
board = genericSTM32F103VE
board_build.mcu = stm32f103vet6
framework = arduino
debug_tool = stlink
upload_protocol = custom

; The core's USB serial (CDC): apre protocol 1 to the page and the Android app.
; The USB clock comes from the internal 48 MHz oscillator, as in the FNIRSI
; firmware (Probe.cpp).
[usb]
build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC -D USBCON -D USBD_CDC_USE_SINGLE_BUFFER
              -D USB_CDC_TRANSMIT_TIMEOUT=500 -D USB_RX_SIZE=512

; The tester for flash, entered through src/boot/BootStub.S when RUN (PB15) is
; held at power-on. Without the USB Sender (NO_USB_SENDER): the menu is
; AprecID, RS232 Tester, Settings. Without the calibration output (CalOut.cpp):
; the DST-210 has none, and PA3, the DSO-510's, holds the power here. The
; settings are kept in the last page of the flash
; (FLASH_SETTINGS, Config.cpp), read on the unit first and found empty.
[env:flash_apre]
; -u t232_boot: nothing calls the way in (the FNIRSI start-up jumps to it),
; and without this the linker drops it.
build_flags = -I src/hw -I src/app -D HAL_TIM_MODULE_ONLY -D HAL_UART_MODULE_ONLY -Wl,-u,t232_boot ${usb.build_flags} -D NO_USB_SENDER -D MASCOT -D FLASH_SETTINGS
build_src_filter = +<app/> +<hw/Lcd.cpp> +<hw/Probe.cpp> +<boot/> -<app/TtlApp.cpp> -<app/Export.cpp> -<app/CalOut.cpp>
lib_deps = adafruit/Adafruit GFX Library@1.12.6
board_build.flash_offset = 0x6B000
board_upload.offset_address = 0x0806B000
; to 0x08100000, the end of the 1 MB part the DST-210 has. Past 0x08080000
; it is the second bank, which the FNIRSI bootloader writes too: it takes
; the flash size from the chip and accepts an update of up to 0xF9000 bytes.
board_upload.maximum_size = 1048576
upload_command = echo "flash_apre is not uploaded: see tools/make_update.py" && exit 1
